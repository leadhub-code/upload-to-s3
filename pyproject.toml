[project]
name = "upload-to-s3"
version = "0.1.0"
description = "Upload a file to AWS S3"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
  "boto3",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "requests",
]

[project.urls]
"Homepage" = "https://github.com/leadhub-code/upload-to-s3"
"Bug Tracker" = "https://github.com/leadhub-code/upload-to-s3/issues"

[project.scripts]
upload_to_s3 = "upload_to_s3:main"
upload-to-s3 = "upload_to_s3:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "single"
